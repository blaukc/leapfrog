services:
  leapfrog-backend:
    container_name: leapfrog-backend
    env_file:
      - .env
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - BACKEND_PORT=${BACKEND_PORT}
    networks:
      - caddy_net
    environment:
      PYTHONUNBUFFERED: "1"
      BACKEND_PORT: 8000
      BACKEND_HOST: ${BACKEND_HOST}
      BACKEND_DOMAIN: ${BACKEND_DOMAIN}
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  leapfrog-frontend:
    container_name: leapfrog-frontend
    env_file:
      - .env
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: "https://blaukc.dev/api/leapfrog"
        VITE_WS_BASE_URL: "wss://blaukc.dev/api/leapfrog"
    networks:
      - caddy_net
    depends_on:
      - leapfrog-backend

networks:
  caddy_net:
    name: caddy_net